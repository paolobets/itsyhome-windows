# Build e test della v3 (assistente «isola») su Windows, macOS e Linux.
# La v2 Tauri in src-tauri/ è fuori dal workspace e non viene costruita qui.
name: v3 build

on:
  push:
    branches: [v3-assistente]
  pull_request:
    branches: [v3-assistente]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype6-dev pkg-config \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build assistente e gestione
        run: cargo build -p assistente -p gestione

      - name: Test del workspace
        run: cargo test --workspace

      - name: Clippy (avvisi = errori)
        run: cargo clippy --workspace --all-targets -- -D warnings
