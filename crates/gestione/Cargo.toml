[package]
name = "gestione"
version = "0.1.0"
edition = "2021"

# Finestra di gestione: processo separato avviato dall'assistente (cornice Slint + area web wry).
# Legami: `ui/cornice.slint` importa il tema da `../assistente/ui/tema.slint`; l'assistente include
# `assets/prova-mail.html`. `cargo build -p assistente` non costruisce questo binario.
[[bin]]
name = "itsyhome-gestione"
path = "src/main.rs"

[dependencies]
gestione-protocollo = { path = "../gestione-protocollo" }
slint = { version = "=1.18.1", features = ["renderer-skia", "unstable-winit-030", "raw-window-handle-06"] }
wry = "=0.57.2"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
# Solo per Esc nel riquadro web (evento AcceleratorKeyPressed del controller): stessa versione di wry.
webview2-com = "0.39"
# Area di lavoro e scala del monitor (misura della finestra): stessa versione dell'assistente.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Controlli sull'interfaccia (ruoli, nomi e scelta delle schede) col backend di prova di Slint: stessa versione dell'assistente.
i-slint-backend-testing = "=1.18.1"
