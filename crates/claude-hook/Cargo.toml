[package]
name = "claude-hook"
version = "0.1.0"
edition = "2021"

# Ascoltatore locale degli hook HTTP di Claude Code (M3) e l'esempio `prova_permesso` (spike del
# permesso, spec M3 §6.3).
[dependencies]
# Analisi delle richieste HTTP, senza allocazioni e senza panico.
httparse = "1"
# Codice casuale dell'ascoltatore.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: l'installazione in settings.json conserva l'ordine delle chiavi dell'utente.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
# Ora locale della barra di stato e delle righe dell'esempio.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# Stessa versione del resto del workspace: PID del mittente (tabella TCP) e catena dei genitori
# (istantanea dei processi).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"
