[package]
name = "assistente"
version = "0.1.0"
edition = "2021"

[dependencies]
casa-core = { path = "../casa-core" }
# Protocollo con la finestra di gestione (processo `itsyhome-gestione`).
gestione-protocollo = { path = "../gestione-protocollo" }
slint = { version = "=1.18.1", features = ["renderer-skia", "unstable-winit-030", "raw-window-handle-06"] }
# Solo l'ora locale per l'orologio del pannello.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Indirizzi dei collegamenti analizzati e serializzati come li vede il browser (WHATWG, IDNA):
# già nel Cargo.lock tramite le dipendenze di casa-core, stessa versione.
url = "=2.5.8"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network"] }
starship-battery = "0.12"
# Notifiche di sistema (toast su Windows): errori solo nel log.
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
# Stessa versione usata da winit 0.30 (HMONITOR = isize): area di lavoro del monitor, ritaglio e procedura della pillola.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_Accessibility",
    # Batteria dei dispositivi Bluetooth (M2, Task 9): SetupAPI e proprietà dei dispositivi.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    # Utilizzo della GPU (M2, Task 10): contatori del kernel grafico (D3DKMT, gdi32.dll), solo a
    # GPU mostrata. Non PDH: lasciava +6 MB dopo la prima apertura (decisione D7).
    "Wdk_Graphics_Direct3D",
] }
# Registro (solo HKCU): avvio con il sistema e identificativo dei toast.
windows-registry = "0.6"
# Icona nella tray con il suo menu (stessa famiglia di muda, già usata da Slint).
tray-icon = { version = "0.26", default-features = false }
# Scorciatoie globali (Ctrl+Alt+Maiusc+Spazio, Ctrl+Alt+Maiusc+I).
global-hotkey = "0.10"
# L'icona della tray (PNG): `image` c'è già per Slint, qui solo il decodificatore PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
# Volume del PC con Core Audio (M2, Task 7): già nel Cargo.lock tramite accesskit, stessa
# versione. `IMMDevice::Activate` vuole anche StructuredStorage e Variant (PROPVARIANT).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Wi-Fi, Bluetooth e icona della rete (M2, Task 8): WinRT `Radio` e `NetworkInformation`;
    # `Foundation` per gli eventi (`TypedEventHandler`) e `IReference<u8>` delle tacche,
    # `Foundation_Collections` per l'elenco delle radio (`IVectorView`).
    "Devices_Radios",
    "Networking_Connectivity",
    "Foundation",
    "Foundation_Collections",
] }
# `#[implement]` (callback COM di Core Audio): la macro scrive `::windows_core`, quindi serve come
# dipendenza diretta (stessa versione di `windows`, già nel Cargo.lock).
windows-core = "0.62.2"

[target.'cfg(not(windows))'.dependencies]
# Avvio con il sistema fuori da Windows (su Windows lo scrive l'app nel registro, solo HKCU).
auto-launch = "0.6"

[dev-dependencies]
tempfile = "3"
# Backend di prova di Slint: crea pillola, pannello e Impostazioni nei test, senza finestre
# (misure Slint↔Rust, ruoli e nomi per l'accessibilità).
i-slint-backend-testing = "=1.18.1"
# Solo per leggere nei test quale elemento ha il fuoco (`WindowInner::focus_item`): stessa
# versione di Slint, nessuna funzione in più.
i-slint-core = { version = "=1.18.1", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"
